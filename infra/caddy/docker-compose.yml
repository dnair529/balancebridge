name: bb-caddy
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      UAT_BASICAUTH_USER: ${UAT_BASICAUTH_USER}
      UAT_BASICAUTH_HASH: ${UAT_BASICAUTH_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/balancebridge/prod/site-dist:/srv/site-prod:ro
      - /srv/balancebridge/uat/site-dist:/srv/site-uat:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - bb-prod
      - bb-uat
volumes:
  caddy_data:
  caddy_config:
networks:
  bb-prod:
    name: bb-prod
    external: true
  bb-uat:
    name: bb-uat
    external: true
