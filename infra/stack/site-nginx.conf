server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Astro builds directory-style URLs (/about/index.html)
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Fingerprinted assets — cache forever
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /downloads/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # HTML — always revalidate so deploys land immediately
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    error_page 404 /404.html;

    # Security headers (Traefik terminates TLS and adds HSTS)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml application/rss+xml;

    server_tokens off;
}
