# Balance Bridge — one stack per environment (uat | prod).
#
# TEMPLATE, not a compose file: `__ENV__` is substituted by infra/vps-deploy.sh.
# Docker Compose only interpolates ${VARS} in *values*, never in mapping KEYS —
# and Traefik router/middleware names live in the label keys, which must be
# unique per environment. Hence the sed placeholder.
#
# IMPORTANT: this VPS already runs Traefik (container n8n-traefik-1) which owns
# ports 80/443 and routes by container label on the `n8n_default` network.
# We publish NO host ports. We attach to that network and advertise ourselves
# with Traefik labels, exactly like the other services on this box.
# Nothing here modifies Traefik or any pre-existing container.
name: bb-__ENV__

x-traefik-common: &traefik-common
  traefik.enable: 'true'
  traefik.docker.network: n8n_default

services:
  # ---------- static marketing site ----------
  site:
    image: nginx:alpine
    container_name: bb-site-__ENV__
    restart: unless-stopped
    volumes:
      - ./site-dist:/usr/share/nginx/html:ro
      - ./site-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      <<: *traefik-common
      traefik.http.routers.bb-site-__ENV__.rule: ${SITE_RULE}
      traefik.http.routers.bb-site-__ENV__.entrypoints: websecure
      traefik.http.routers.bb-site-__ENV__.tls: 'true'
      traefik.http.routers.bb-site-__ENV__.tls.certresolver: mytlschallenge
      traefik.http.routers.bb-site-__ENV__.middlewares: ${SITE_MIDDLEWARES}
      traefik.http.services.bb-site-__ENV__.loadbalancer.server.port: '80'
      # apex -> www redirect is handled by the site router rule; noindex for uat:
      traefik.http.middlewares.bb-noindex-__ENV__.headers.customresponseheaders.X-Robots-Tag: noindex
    networks: [edge]

  # ---------- client portal ----------
  portal:
    build:
      context: ./repo/portal
    image: bb-portal:__ENV__
    container_name: bb-portal-__ENV__
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgres://portal:${POSTGRES_PASSWORD}@db:5432/portal
      UPLOADS_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    labels:
      <<: *traefik-common
      traefik.http.routers.bb-portal-__ENV__.rule: Host(`${PORTAL_HOST}`)
      traefik.http.routers.bb-portal-__ENV__.entrypoints: websecure
      traefik.http.routers.bb-portal-__ENV__.tls: 'true'
      traefik.http.routers.bb-portal-__ENV__.tls.certresolver: mytlschallenge
      traefik.http.services.bb-portal-__ENV__.loadbalancer.server.port: '3000'
    networks: [default, edge]

  # ---------- database (internal only — no host port, not on the edge network) ----------
  db:
    image: postgres:16-alpine
    container_name: bb-db-__ENV__
    restart: unless-stopped
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: portal
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U portal -d portal']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [default]

  # ---------- e-signature ----------
  docuseal:
    image: docuseal/docuseal:latest
    container_name: bb-docuseal-__ENV__
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://portal:${POSTGRES_PASSWORD}@db:5432/docuseal
      SECRET_KEY_BASE: ${DOCUSEAL_SECRET_KEY_BASE}
      HOST: ${DOCUSEAL_PUBLIC_HOST}
      FORCE_SSL: 'true'
    volumes:
      - docuseal:/data
    depends_on:
      db:
        condition: service_healthy
    labels:
      <<: *traefik-common
      traefik.http.routers.bb-sign-__ENV__.rule: Host(`${DOCUSEAL_PUBLIC_HOST}`)
      traefik.http.routers.bb-sign-__ENV__.entrypoints: websecure
      traefik.http.routers.bb-sign-__ENV__.tls: 'true'
      traefik.http.routers.bb-sign-__ENV__.tls.certresolver: mytlschallenge
      traefik.http.services.bb-sign-__ENV__.loadbalancer.server.port: '3000'
    networks: [default, edge]

  # ---------- nightly backups ----------
  backup:
    image: postgres:16-alpine
    container_name: bb-backup-__ENV__
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
      - uploads:/data/uploads:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [default]
    entrypoint: /bin/sh
    command:
      - -c
      - |
        while true; do
          sleep_secs=$$(( ( ( 3*3600 + 15*60 ) - ( $$(date +%s) % 86400 ) + 86400 ) % 86400 ));
          sleep $$sleep_secs;
          ts=$$(date +%Y%m%d-%H%M%S);
          pg_dump -h db -U portal portal   | gzip > /backups/portal-$$ts.sql.gz;
          pg_dump -h db -U portal docuseal | gzip > /backups/docuseal-$$ts.sql.gz || true;
          tar czf /backups/uploads-$$ts.tar.gz -C /data uploads;
          find /backups -type f -mtime +14 -delete;
        done

volumes:
  pgdata:
  uploads:
  docuseal:

networks:
  default:
    name: bb-__ENV__-internal
  edge:
    name: n8n_default
    external: true
